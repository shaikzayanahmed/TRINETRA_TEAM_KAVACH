<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="50%" stop-color="#152438"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Tactical Grid -->
  <g stroke="rgba(173,198,255,0.08)" stroke-width="1" stroke-dasharray="6,6">
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
  </g>

  <!-- Highway Road Lines -->
  <polygon points="400,720 540,280 740,280 880,720" fill="rgba(30,41,59,0.5)" stroke="rgba(148,163,184,0.3)" stroke-width="2"/>
  <line x1="640" y1="280" x2="640" y2="720" stroke="#facc15" stroke-width="3" stroke-dasharray="25,15"/>

  <!-- Virtual Trap Polygon -->
  <polygon points="480,340 800,340 760,560 440,560" fill="rgba(255,84,73,0.18)" stroke="#ff5449" stroke-width="3" filter="url(#glow)"/>

  <!-- Vehicle Silhouette & BBox -->
  <rect x="490" y="380" width="300" height="170" rx="8" fill="none" stroke="#ff5449" stroke-width="3"/>
  <rect x="490" y="348" width="300" height="30" rx="4" fill="#ff5449"/>
  <text x="500" y="368" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">VEHICLE · HIGHWAY TRAP BREACH (98.4%)</text>

  <!-- ANPR Plate Highlight -->
  <rect x="580" y="490" width="120" height="40" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="580" y="490" width="20" height="40" fill="#003399"/>
  <text x="610" y="515" fill="#000000" font-family="monospace" font-size="14" font-weight="bold">DL 01 AB 1234</text>

  <!-- Header Overlay -->
  <rect x="25" y="25" width="510" height="65" rx="8" fill="rgba(10,14,22,0.85)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="40" y="52" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">TRINETRA FORENSIC SNAPSHOT · EV-00395</text>
  <text x="40" y="75" fill="#94a3b8" font-family="monospace" font-size="11">CAM-STREAM-02 · HIGHWAY NH-1A CORRIDOR · 34.2960° N, 77.7510° E</text>

  <!-- Security Seal Badge -->
  <rect x="880" y="25" width="375" height="65" rx="8" fill="rgba(10,14,22,0.85)" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="905" cy="57" r="10" fill="#22c55e"/>
  <text x="925" y="50" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">MINIO S3 TAMPER-PROOF SEALED</text>
  <text x="925" y="72" fill="#94a3b8" font-family="monospace" font-size="10">SHA-256: a8b9c0d1e2f3a4b5c6d7e8f9...</text>

  <!-- Timestamp Overlay -->
  <rect x="25" y="660" width="360" height="35" rx="6" fill="rgba(10,14,22,0.85)" stroke="#64748b" stroke-width="1"/>
  <text x="40" y="683" fill="#e2e8f0" font-family="monospace" font-size="13">2026-09-08 09:04:10.884 UTC+05:30</text>
</svg>
