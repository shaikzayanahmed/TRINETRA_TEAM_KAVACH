<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#adc6ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95d4b0" />
      <stop offset="100%" stop-color="#3e7b5c" />
    </linearGradient>
  </defs>
  <!-- Tactical Hex Shield Outline -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="#adc6ff" stroke-width="2.5" stroke-opacity="0.8" fill="#181c24" />
  <!-- Tri-Vector Radar Reticle -->
  <circle cx="50" cy="50" r="32" stroke="#424754" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle cx="50" cy="50" r="20" stroke="#8c909f" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Tri-Vector Core -->
  <polygon points="50,22 74,66 26,66" stroke="url(#primaryGrad)" stroke-width="3" fill="none" stroke-linejoin="round" />
  <!-- Center Pupil / Optical Eye -->
  <circle cx="50" cy="50" r="7" fill="url(#primaryGrad)" />
  <circle cx="50" cy="50" r="3" fill="#0f131b" />
  <!-- Reticle Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="#95d4b0" stroke-width="2" />
  <line x1="82" y1="68" x2="74" y2="64" stroke="#95d4b0" stroke-width="2" />
  <line x1="18" y1="68" x2="26" y2="64" stroke="#95d4b0" stroke-width="2" />
</svg>
